name: Windows Build & Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expand initial source archive (first run only)
        shell: pwsh
        run: |
          if (Test-Path source-archive.zip) {
            Expand-Archive -Path source-archive.zip -DestinationPath . -Force
            Remove-Item source-archive.zip
          }
      - name: Publish unpacked source (first run only)
        id: source
        shell: pwsh
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if (git status --porcelain) {
            git commit -m "feat: add Melodify desktop application source"
            git push origin HEAD:main
          }
          "commit_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test and build
        run: |
          npm test
          npm run build
      - name: Build Windows installer and portable app
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: Melodify-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          target_commitish: ${{ steps.source.outputs.commit_sha }}
          name: Melodify v0.1.1 — Windows Preview
          prerelease: true
          generate_release_notes: true
          files: release/*.exe
