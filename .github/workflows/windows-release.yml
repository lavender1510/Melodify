name: Windows Build & Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: melodify-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expand initial source archive (first run only)
        shell: pwsh
        run: |
          if (Test-Path source-archive.zip) {
            Expand-Archive -Path source-archive.zip -DestinationPath . -Force
            Remove-Item source-archive.zip
          }
      - name: Publish unpacked source (first run only)
        id: source
        shell: pwsh
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if (git status --porcelain) {
            git commit -m "feat: add Melodify desktop application source"
            git push origin HEAD:main
          }
          "commit_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Electron and electron-builder tools
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron
            ~\AppData\Local\electron-builder\Cache
          key: windows-electron-builder-${{ hashFiles('package.json') }}
          restore-keys: |
            windows-electron-builder-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Electron runtime
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            npx electron --version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          } while ($attempt -lt 3)
          exit $LASTEXITCODE
      - name: Test and build
        run: |
          npm test
          npm run build
          npm run test:audio
      - name: Build Windows installer and portable app
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            npx electron-builder --win dir --x64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          } while ($attempt -lt 3)
          exit $LASTEXITCODE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package portable ZIP
        shell: pwsh
        run: |
          if (Test-Path "release\Melodify-${{ steps.version.outputs.version }}-portable.zip") { Remove-Item "release\Melodify-${{ steps.version.outputs.version }}-portable.zip" -Force }
          Compress-Archive -Path "release\win-unpacked\*" -DestinationPath "release\Melodify-${{ steps.version.outputs.version }}-portable.zip" -CompressionLevel Optimal
      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: Melodify-Windows
          path: release/Melodify-${{ steps.version.outputs.version }}-portable.zip
          if-no-files-found: error
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.source.outputs.commit_sha }}
          name: Melodify v${{ steps.version.outputs.version }} — Windows Preview
          prerelease: true
          generate_release_notes: true
          files: release/Melodify-${{ steps.version.outputs.version }}-portable.zip
