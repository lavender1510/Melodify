name: Windows verification (no release)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: melodify-verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache Electron and electron-builder tools
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron
            ~\AppData\Local\electron-builder\Cache
          key: windows-electron-builder-${{ hashFiles('package.json') }}
          restore-keys: |
            windows-electron-builder-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare Electron runtime
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            npx electron --version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          } while ($attempt -lt 3)
          exit $LASTEXITCODE
      - name: Test and build
        run: |
          npm test
          npm run build
          npm run test:codecs
          npm run test:audio
          npm run test:desktop
      - name: Build Windows installer and portable app
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            npx electron-builder --win dir --x64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          } while ($attempt -lt 3)
          exit $LASTEXITCODE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Windows setup installer (NSIS)
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            npx electron-builder --win nsis --x64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          } while ($attempt -lt 3)
          exit $LASTEXITCODE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package portable ZIP
        shell: pwsh
        run: |
          if (Test-Path "release\Melodify-${{ steps.version.outputs.version }}-portable.zip") { Remove-Item "release\Melodify-${{ steps.version.outputs.version }}-portable.zip" -Force }
          Compress-Archive -Path "release\win-unpacked\*" -DestinationPath "release\Melodify-${{ steps.version.outputs.version }}-portable.zip" -CompressionLevel Optimal
      - name: Verify setup installer
        shell: pwsh
        run: |
          $file = "release\\Melodify-${{ steps.version.outputs.version }}-x64.exe"
          if (!(Test-Path $file)) { throw "Windows setup installer not found: $file" }
          $item = Get-Item $file
          if ($item.Length -lt 1000000) { throw "Windows setup installer is unexpectedly small" }
          Write-Host "Verified Windows setup installer: $file ($($item.Length) bytes)"
      - name: Install, start and uninstall NSIS; start extracted portable ZIP
        shell: pwsh
        run: |
          $setup = (Resolve-Path "release/Melodify-${{ steps.version.outputs.version }}-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "Melodify-install-smoke"
          $install = Start-Process -FilePath $setup -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }
          $exe = Join-Path $installDir "Melodify.exe"
          if (!(Test-Path $exe)) { throw "Installed executable missing" }
          node scripts/desktop-smoke.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Installed app smoke failed" }
          $uninstaller = Get-ChildItem $installDir -Filter "*Uninstall*.exe" | Select-Object -First 1
          if (!$uninstaller) { throw "NSIS uninstaller missing" }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S", "_?=$installDir" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed" }
          if (Test-Path $exe) { throw "NSIS uninstall left installed executable" }
          $portableDir = Join-Path $env:RUNNER_TEMP "Melodify-portable-smoke"
          Expand-Archive -Path "release/Melodify-${{ steps.version.outputs.version }}-portable.zip" -DestinationPath $portableDir
          node scripts/desktop-smoke.cjs (Join-Path $portableDir "Melodify.exe")
          if ($LASTEXITCODE -ne 0) { throw "Portable app smoke failed" }
      - name: Upload Windows setup installer
        uses: actions/upload-artifact@v4
        with:
          name: Melodify-Windows-Setup
          path: release/Melodify-${{ steps.version.outputs.version }}-x64.exe
          if-no-files-found: error
      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: Melodify-Windows
          path: release/Melodify-${{ steps.version.outputs.version }}-portable.zip
          if-no-files-found: error
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melodify-validation
          path: work/codec-results-*.json
          if-no-files-found: warn
