name: Android build and device tests
on:
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      prepare_draft:
        description: Prepare an unpublished Android preview draft after successful tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Unit tests, lint and installable debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable KVM for Android emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native device integration and Compose UI tests (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          working-directory: apps/android
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            mkdir -p app/build/reports/screenshots
            adb exec-out run-as dev.lyvt.melodify.android cat files/android-home.png > app/build/reports/screenshots/android-home.png
            adb exec-out run-as dev.lyvt.melodify.android cat files/android-settings.png > app/build/reports/screenshots/android-settings.png
            python3 -c "from pathlib import Path; assert all(p.read_bytes().startswith(bytes([137,80,78,71,13,10,26,10])) for p in Path('app/build/reports/screenshots').glob('*.png'))"
      - name: Build unsigned optimized release APK and AAB
        run: ./gradlew assembleRelease bundleRelease
      - name: Prepare clearly labelled packages
        run: |
          mkdir -p preview
          cp app/build/outputs/apk/debug/app-debug.apk preview/Melodify-Android-0.1.0-test.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk preview/Melodify-Android-0.1.0-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab preview/Melodify-Android-0.1.0-unsigned.aab
          cd preview
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: Melodify-Android-v0.1.0
          if-no-files-found: error
          path: apps/android/preview/*
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melodify-Android-test-reports
          if-no-files-found: warn
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
            apps/android/app/build/outputs/androidTest-results/
  draft:
    if: (github.event_name == 'workflow_dispatch' && inputs.prepare_draft) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/android-v0.1.0')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Melodify-Android-v0.1.0
          path: packages
      - name: Prepare draft only; never publish
        run: |
          cd packages
          sha256sum -c SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          Native Android-Preview (API 29+), Kotlin/Compose und Media3-Hintergrundwiedergabe. Bibliothek, Suche, Playlists, Favoriten, 122 übernommene Themes, Einstellungen, Sleep-Timer und lokale Lyrics.

          Ausschließlich zum Testen: Die Test-APK ist mit einem Debug-Schlüssel signiert. Release-APK und AAB sind unsigned. Kein Produktionsschlüssel vorhanden. Geräteabhängige Decoder, Bluetooth/Headsets, Audio-Focus-Unterbrechungen und OEM-Hintergrundregeln benötigen zusätzliche reale Hardware-Abnahme. Ausführlicher Teststand und Einschränkungen im Android-README des Quellstands.

          Dieser Release ist ein Entwurf und darf erst nach ausdrücklicher Freigabe veröffentlicht werden.
          NOTES
          if gh release view android-v0.1.0 --json isDraft --jq '.isDraft' > draft-state.txt 2>/dev/null; then
            test "$(cat draft-state.txt)" = true
            gh release edit android-v0.1.0 --target "$SOURCE_SHA" --notes-file notes.md
          else
            gh release create android-v0.1.0 --target "$SOURCE_SHA" --title 'Melodify Android v0.1.0 — Preview' --draft --prerelease --notes-file notes.md
          fi
          gh release upload android-v0.1.0 ./*.apk ./*.aab SHA256SUMS.txt --clobber
